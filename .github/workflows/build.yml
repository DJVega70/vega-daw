name: Build Vega Productions DAW
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TE_COMMIT: c6293127cdc0a8488aea2ae0907f4709ee89c228   # Tracktion Engine (GPLv3), pinned

jobs:
  test:
    name: Engine self-test (Linux, headless)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libgl1-mesa-dev libcurl4-openssl-dev
      - name: Fetch Tracktion Engine
        run: |
          git clone --filter=blob:none https://github.com/Tracktion/tracktion_engine.git te
          cd te && git checkout $TE_COMMIT
          git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --depth 1 modules/juce
      - name: Build test
        run: |
          cmake -B build -DTE_DIR=$PWD/te -DVEGA_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target VegaDAWTest VegaStemHelper -j4
      - name: Download the Demucs model (for the real stem-separation test)
        continue-on-error: true
        run: |
          curl -fL --retry 3 -o htdemucs-4s.bin "https://huggingface.co/datasets/Retrobear/demucs.cpp/resolve/main/ggml-model-htdemucs-4s-f16.bin"
          ls -la htdemucs-4s.bin && echo "VEGA_DEMUCS_MODEL=$PWD/htdemucs-4s.bin" >> $GITHUB_ENV
      - name: Run engine self-test
        run: build/VegaDAWTest_artefacts/Release/VegaDAWTest
      - name: Stem helper self-test (real model)
        if: env.VEGA_DEMUCS_MODEL != ''
        run: |
          code=0; build/VegaStemHelper_artefacts/Release/VegaStemHelper --selftest "$VEGA_DEMUCS_MODEL" 2 > helper.log || code=$?
          grep -v '^PROGRESS' helper.log | tail -3; echo "exit code $code"; grep -q '^DONE' helper.log

  windows:
    name: Windows app
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tracktion Engine
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/Tracktion/tracktion_engine.git te
          cd te && git checkout $TE_COMMIT
          git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --depth 1 modules/juce
      - name: Fetch ASIO SDK (optional - builds with WASAPI/DirectSound if unavailable)
        shell: bash
        continue-on-error: true
        run: |
          curl -fL -o asio.zip "https://www.steinberg.net/asiosdk" && unzip -q asio.zip -d asio
          dir=$(dirname "$(find asio -name iasiodrv.h | head -1)")
          [ -n "$dir" ] && echo "ASIO_DIR=$(cd "$dir/.." && pwd -W)" >> $GITHUB_ENV
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ -n "$ASIO_DIR" ]; then EXTRA="-DVEGA_ASIO=ON -DASIO_SDK_DIR=$ASIO_DIR"; echo "Building with ASIO"; fi
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DTE_DIR="$(pwd -W)/te" $EXTRA
      - name: Build
        run: cmake --build build --config Release --target VegaDAW --parallel
      - name: Stem separation self-test on Windows (real model, both engine builds)
        shell: bash
        run: |
          curl -fL --retry 3 -o htdemucs-4s.bin "https://huggingface.co/datasets/Retrobear/demucs.cpp/resolve/main/ggml-model-htdemucs-4s-f16.bin"
          for h in VegaStemHelper VegaStemHelperAVX2; do
            echo "== $h"
            code=0; "build/VegaDAW_artefacts/Release/$h.exe" --selftest htdemucs-4s.bin 2 > "$h.log" || code=$?
            grep -v '^PROGRESS' "$h.log" | tail -3; echo "exit code $code"
            grep -q '^DONE' "$h.log" || exit 1
          done
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/VegaDAW_artefacts/Release/Vega Productions DAW.exe" dist/
          Copy-Item "build/VegaDAW_artefacts/Release/VegaStemHelper.exe", "build/VegaDAW_artefacts/Release/VegaStemHelperAVX2.exe" dist/
          Copy-Item README.md, LICENSE, TRACKTION_LICENSE.md dist/
          Compress-Archive -Path dist/* -DestinationPath VegaProductions-DAW-Windows.zip
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(VegaDAW VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver.${{ github.run_number }}" "/DSrcDir=$PWD\dist" installer\VegaDAW.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer-out\VegaProductions-DAW-Setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: VegaProductions-DAW-Windows
          path: |
            VegaProductions-DAW-Windows.zip
            VegaProductions-DAW-Setup.exe

  android:
    name: Android app (Vega Sketch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phone engine self-test (C++, on Linux)
        run: |
          g++ -std=c++17 -O2 -Iandroid/app/src/main/cpp android/app/src/test/cpp/engine_test.cpp android/app/src/main/cpp/SketchEngine.cpp -o engine_test -lpthread
          mkdir -p sketch-test && ./engine_test sketch-test android/app/src/main/assets/kits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # One fixed signing key, so each new APK installs over the last one: the VEGA_KEYSTORE_B64 / VEGA_KEYSTORE_PASSWORD
      # secrets if they're set, otherwise a key generated once and kept in the Actions cache.
      - name: Restore the signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.vega-signing
          key: vega-sketch-signing-key-v1
      - name: Signing key
        env:
          KS_B64: ${{ secrets.VEGA_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.VEGA_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.vega-signing
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.vega-signing/release.jks; echo -n "$KS_PW" > ~/.vega-signing/pw; echo "Using the repository secret key"
          elif [ ! -f ~/.vega-signing/release.jks ]; then
            PW=$(openssl rand -base64 18); echo -n "$PW" > ~/.vega-signing/pw
            keytool -genkeypair -keystore ~/.vega-signing/release.jks -storetype PKCS12 -alias vega -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Vega Productions, O=Vega Productions, C=US"
            echo "Generated a new signing key (kept in the Actions cache)"
          else
            echo "Using the cached key"
          fi
          echo "VEGA_KEYSTORE=$HOME/.vega-signing/release.jks" >> $GITHUB_ENV
          echo "VEGA_KEYSTORE_PASSWORD=$(cat ~/.vega-signing/pw)" >> $GITHUB_ENV
      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk VegaSketch-Android.apk && ls -la VegaSketch-Android.apk
          unzip -l VegaSketch-Android.apk | grep -E "libvegasketch.so|liboboe.so|libc\+\+_shared.so|classes.dex"
          unzip -l VegaSketch-Android.apk | grep -q "lib/arm64-v8a/libvegasketch.so"
          unzip -l VegaSketch-Android.apk | grep -q "assets/kits/vintage808/36.wav"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs VegaSketch-Android.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: VegaSketch-Android
          path: VegaSketch-Android.apk

  macos:
    name: macOS app (Universal)
    if: false   # Mac build switched off (no Mac in the studio right now) - delete this line to turn it back on
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tracktion Engine
        run: |
          git clone --filter=blob:none https://github.com/Tracktion/tracktion_engine.git te
          cd te && git checkout $TE_COMMIT
          git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --depth 1 modules/juce
      - name: Configure
        run: cmake -B build -G Xcode -DTE_DIR=$PWD/te -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target VegaDAW --parallel
      - name: Sign and package
        run: |
          APP="build/VegaDAW_artefacts/Release/Vega Productions DAW.app"
          codesign --force --deep -s - "$APP"
          mkdir -p dist && cp -R "$APP" dist/ && cp README.md LICENSE TRACKTION_LICENSE.md dist/
          cd dist && zip -r -y ../VegaProductions-DAW-macOS.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: VegaProductions-DAW-macOS
          path: VegaProductions-DAW-macOS.zip

  release:
    name: Publish release
    needs: [test, windows, macos, android]
    # publish whenever the tests and Windows build pass; GitHub's macOS runners are sometimes unavailable
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect zips
        run: |
          mkdir out
          find dist \( -name '*.zip' -o -name '*Setup.exe' -o -name '*.apk' \) -exec cp {} out/ \;
          ls -la out
      - name: Carry over the previous Mac build if this run has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls out/*macOS*.zip >/dev/null 2>&1; then
            gh release download --repo "${{ github.repository }}" --pattern '*macOS*.zip' --dir out || echo "no previous Mac build"
          fi
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vega Productions DAW - build ${{ github.run_number }}
          make_latest: true
          body: |
            **Windows (recommended):** download `VegaProductions-DAW-Setup.exe` and run it. It installs to Program Files, adds Start menu (and optional desktop) shortcuts, opens `.vegaproj` projects, and shows up in Settings > Apps for uninstalling. Running a newer Setup updates your install.
            **Android phone (Vega Sketch):** download `VegaSketch-Android.apk` on the phone and open it (allow installing from your browser / Files the first time). Send sketches to the PC from the menu, then File > Import phone sketch in the DAW.
            **Windows (portable):** `VegaProductions-DAW-Windows.zip`, unzip anywhere and run `Vega Productions DAW.exe`.
            **Mac:** download `VegaProductions-DAW-macOS.zip`, drag the app to Applications, then run once in Terminal:
            `xattr -cr "/Applications/Vega Productions DAW.app"`
          files: |
            out/*.zip
            out/*.exe
            out/*.apk
